name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear e ler a versão
        run: |
          cp app/build/outputs/apk/release/app-release.apk ZEUS-Optimizer.apk
          echo "VERSAO=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ZEUS-Optimizer-apk
          path: ZEUS-Optimizer.apk

      - name: Publicar para download no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}.${{ github.run_number }}
          name: ZEUS Optimizer v${{ env.VERSAO }} (build ${{ github.run_number }})
          files: ZEUS-Optimizer.apk

  # Instala o APK num celular Android virtual e tira prints de cada tela
  teste-emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ZEUS-Optimizer-apk

      - name: Baixar app de exemplo para o teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.2 -R ${{ github.repository }} -p ZEUS-Optimizer.apk -O exemplo.apk || true

      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash .github/teste-emulador.sh

      - name: Guardar prints no branch prints-teste
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mv prints /tmp/prints
          git checkout --orphan prints-teste
          git rm -rqf .
          cp -r /tmp/prints ./prints
          git add prints
          git commit -qm "Prints do teste ${{ github.run_number }}"
          git push -qf origin prints-teste
