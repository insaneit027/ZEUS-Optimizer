name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk ZEUS-Optimizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZEUS-Optimizer-apk
          path: ZEUS-Optimizer.apk

      - name: Publicar para download no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ZEUS Optimizer v1.0.${{ github.run_number }}
          files: ZEUS-Optimizer.apk
